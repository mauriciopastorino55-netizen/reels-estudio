          <h1 class="scene-title" style="margin-bottom:12px;">${sc.title || ""}</h1>
          <div class="ladder">${stepsHtml}</div>
          ${sc.footer ? `<div class="critics-footer" data-at="${sc.footer.at ?? sc.start}">${sc.footer.text}</div>` : ""}
        </section>`;
      }

      if (sc.type === "persecucion") {
        return `<section class="scene${actCls}" data-scene="${idx}">
          <h1 class="scene-title">${sc.title || ""}</h1>
          <div class="chase-stage">
            ${sc.dropped ? `<div class="chase-actor chase-dropped" data-at="${sc.dropped.at ?? sc.start}" data-fade-at="${sc.dropped.fadeAt ?? sc.start + 3}">
              <img class="sprite-img" draggable="false" style="width:84px;height:84px;" src="${img(sc.dropped.img)}" alt="" /><div class="actor-sub">${sc.dropped.title || ""}</div></div>` : ""}
            <div class="chase-actor chase-target" data-at="${sc.target.at ?? sc.start}" data-ascend-at="${sc.ascendAt ?? sc.start + 2}">
              <div class="sprite-medallion medallion-${sc.target.aura || "gold"}" style="width:118px;height:118px;"><img class="sprite-img" draggable="false" style="width:104px;height:104px;" src="${img(sc.target.img)}" alt="" /></div>
              <div class="actor-title">${sc.target.title || ""}</div>
            </div>
            <div class="chase-actor chase-hunter" data-at="${sc.hunter.at ?? sc.start}" data-ascend-at="${sc.ascendAt ?? sc.start + 2}">
              <div class="sprite-medallion medallion-${sc.hunter.aura || "night"}" style="width:118px;height:118px;"><img class="sprite-img" draggable="false" style="width:104px;height:104px;" src="${img(sc.hunter.img)}" alt="" /></div>
              <div class="actor-title">${sc.hunter.title || ""}</div>
            </div>
          </div>
          ${sc.pill ? `<div class="tag-pill" data-at="${sc.pill.at ?? sc.start}">${sc.pill.text}</div>` : ""}
        </section>`;
      }
      return "";
    }

    function revokeUrls(bucket) { bucket.forEach(u => URL.revokeObjectURL(u)); bucket.length = 0; }

    function attachMediaListeners(mediaEl) {
      mediaEl.onplay = () => { hideStatus(); cancelAnimationFrame(rafId); rafId = requestAnimationFrame(tick); };
      mediaEl.onpause = () => { cancelAnimationFrame(rafId); if (!mediaEl.ended && !isScrubbing && !isTransitioning) showStatus("⏸ En pausa"); };
      mediaEl.onended = () => {
        cancelAnimationFrame(rafId);
        if (settings.onEnd === "loop") { mediaEl.currentTime = 0; mediaEl.play(); }
        else if (feedIndex < feedVideos.length - 1) animateReelStep(1);
        else showStatus("↻ Fin · Tocá para repetir");
      };
    }

    function openFolderFeed(folderName, videos, startIdx = 0) {
      feedVideos = videos;
      hudAuthor.textContent = folderName;
      showFeedView(true);
      loadVideoAt(startIdx, true);
    }

    function loadVideoAt(idx, autoplay = true) {
      if (idx < 0 || idx >= feedVideos.length) return;
      stopActiveMedia();
      feedIndex = idx;
      activeVideoItem = feedVideos[idx];
      currentSceneIdx = -1;
      hudCounter.textContent = `${idx + 1} / ${feedVideos.length}`;
      revokeUrls(activeObjectUrls);

      if (activeVideoItem.kind === "mp4") {
        subtitleZone.classList.add("hidden");
        const src = activeVideoItem.source === "idb"
          ? (() => { const u = URL.createObjectURL(activeVideoItem.blob); activeObjectUrls.push(u); return u; })()
          : activeVideoItem.src;

        reelViewport.innerHTML = `<div class="mp4-stage"><video class="mp4-video" id="mp4Player" playsinline preload="auto" src="${src}"></video></div>`;
        const vid = document.getElementById("mp4Player");
        activeMediaEl = vid;
        vid.playbackRate = settings.rate;
        attachMediaListeners(vid);
        updateVisuals(0);
        if (autoplay) vid.play().catch(() => showStatus("▶ Tocá para reproducir"));
      } else {
        subtitleZone.classList.toggle("hidden", settings.subs === "off");
        const scenes = (activeVideoItem.reel && activeVideoItem.reel.scenes) || [];
        reelViewport.innerHTML = scenes.map((sc, i) => buildSceneHTML(sc, i, activeVideoItem, activeObjectUrls, i === 0)).join("");
        audio.src = getAssetUrl(activeVideoItem, activeVideoItem.reel.audio, activeObjectUrls);
        activeMediaEl = audio;
        audio.playbackRate = settings.rate;
        audio.currentTime = 0;
        attachMediaListeners(audio);
        updateVisuals(0);
        if (autoplay) audio.play().catch(() => showStatus("▶ Tocá para reproducir"));
      }
    }

    function renderPeekFor(targetIdx) {
      revokeUrls(peekObjectUrls);
      const entry = feedVideos[targetIdx];
      if (!entry) return;
      if (entry.kind === "mp4") {
        peekViewport.innerHTML = `<div class="mp4-peek-card">
          <div class="video-thumb-mp4" style="width:78px;height:100px;font-size:12px;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span>MP4</span>
          </div>
          <div class="scene-title" style="margin:0;">${entry.title}</div>
        </div>`;
      } else {
        const firstScene = (entry.reel.scenes || [])[0];
        peekViewport.innerHTML = firstScene ? buildSceneHTML(firstScene, 0, entry, peekObjectUrls, true) : "";
      }
    }

    function updateVisuals(t) {
      if (!activeVideoItem || !activeMediaEl) return;
      const dur = (activeMediaEl.duration && isFinite(activeMediaEl.duration)) ? activeMediaEl.duration : (activeVideoItem.duration || 1);
      if (!isScrubbing) scrubFill.style.width = `${Math.min(100, (t / dur) * 100)}%`;
      timeMini.textContent = `${fmt(t)} / ${fmt(dur)}`;
      if (activeVideoItem.kind === "mp4") return;

      const reel = activeVideoItem.reel;
      const scenes = reel.scenes || [];
      let nextIdx = 0;
      for (let i = 0; i < scenes.length; i++) if (t >= scenes[i].start) nextIdx = i;

      const sceneEls = reelViewport.querySelectorAll(".scene");
      if (nextIdx !== currentSceneIdx) {
        sceneEls.forEach((el, i) => {
          if (i === currentSceneIdx && i !== nextIdx) { el.classList.remove("active"); el.classList.add("exiting"); setTimeout(() => el.classList.remove("exiting"), 620); }
          else if (i === nextIdx) { el.classList.remove("exiting"); el.classList.add("active"); }
          else { el.classList.remove("active", "exiting"); }
        });
        currentSceneIdx = nextIdx;
      }

      const activeEl = sceneEls[nextIdx];
      if (activeEl) {
        activeEl.querySelectorAll("[data-at]").forEach(el => el.classList.toggle("show", t >= Number(el.dataset.at)));
        activeEl.querySelectorAll("[data-dim-at]").forEach(el => el.classList.toggle("dimmed", t >= Number(el.dataset.dimAt)));
        activeEl.querySelectorAll("[data-conv-left]").forEach(el => el.classList.toggle("converge-left", t >= Number(el.dataset.convLeft)));
        activeEl.querySelectorAll("[data-conv-right]").forEach(el => el.classList.toggle("converge-right", t >= Number(el.dataset.convRight)));
        activeEl.querySelectorAll("[data-hi-at]").forEach(el => el.classList.toggle("highlight", t >= Number(el.dataset.hiAt)));
        activeEl.querySelectorAll("[data-ascend-at]").forEach(el => el.classList.toggle("ascend", t >= Number(el.dataset.ascendAt)));
        activeEl.querySelectorAll("[data-fade-at]").forEach(el => el.classList.toggle("fade-away", t >= Number(el.dataset.fadeAt)));
      }

      const subs = reel.subtitles || [];
      let subText = "";
      for (let i = 0; i < subs.length; i++) {
        if (t >= subs[i].start && t <= subs[i].end + 0.14) { subText = subs[i].text; break; }
      }
      if (subText && settings.subs === "on") { subtitlePill.textContent = subText; subtitlePill.classList.add("visible"); }
      else { subtitlePill.classList.remove("visible"); }
    }

    function tick() {
      if (!activeMediaEl) return;
      updateVisuals(activeMediaEl.currentTime);
      if (!activeMediaEl.paused && !activeMediaEl.ended) rafId = requestAnimationFrame(tick);
    }

    function showStatus(text) { statusPill.textContent = text; statusPill.classList.add("show"); }
    function hideStatus() { statusPill.classList.remove("show"); }

    /* =====================================================================
       7. GESTOS 1:1 TIKTOK + IDA Y VUELTA COMPLETA POR CARPETAS
       ===================================================================== */
    const CARD_GAP = 14;
    let ptrDown = false;
    let startX = 0, startY = 0, lastX = 0, lastY = 0, lastTime = 0, startTime = 0;
    let dragVx = 0, dragVy = 0;
    let dragMode = null;
    let stageH = 0;
    let holdTimer = null;
    let isHold2x = false;

    function preparePeek(dir) {
      stageH = reelShell.clientHeight || window.innerHeight;
      reelCurrent.style.transition = "none";
      reelPeek.style.transition = "none";
      if (dir === "next") { renderPeekFor(feedIndex + 1); reelPeek.style.transform = `translateY(${stageH + CARD_GAP}px)`; }
      else { renderPeekFor(feedIndex - 1); reelPeek.style.transform = `translateY(${-stageH - CARD_GAP}px)`; }
      reelPeek.style.display = "block";
    }

    function cleanupDrag() {
      reelCurrent.style.transition = "none"; reelCurrent.style.transform = "";
      void reelCurrent.offsetWidth; reelCurrent.style.transition = "";
      reelPeek.style.transition = "none"; reelPeek.style.transform = ""; reelPeek.style.display = "none";
      dragMode = null;
    }

    function animateReelStep(delta) {
      if (isTransitioning) return;
      const target = feedIndex + delta;
      if (target < 0 || target >= feedVideos.length) return;
      isTransitioning = true;
      stopActiveMedia();
      const dir = delta > 0 ? "next" : "prev";
      preparePeek(dir);
      void reelPeek.offsetWidth;
      const snapMs = 240;
      const ease = `transform ${snapMs}ms cubic-bezier(0.22, 1, 0.36, 1)`;
      reelCurrent.style.transition = ease;
      reelPeek.style.transition = ease;
      reelCurrent.style.transform = `translateY(${dir === "next" ? -stageH - CARD_GAP : stageH + CARD_GAP}px)`;
      reelPeek.style.transform = "translateY(0)";
      setTimeout(() => { loadVideoAt(target, true); cleanupDrag(); isTransitioning = false; }, snapMs);
    }

    function isInteractiveTarget(el) {
      return Boolean(el.closest(".hud-btn, .scrub-zone, .settings-drawer, .drawer-backdrop"));
    }

    reelShell.addEventListener("pointerdown", (e) => {
      if (isTransitioning || isInteractiveTarget(e.target)) return;
      ptrDown = true; startX = lastX = e.clientX; startY = lastY = e.clientY;
      startTime = lastTime = Date.now(); dragVx = 0; dragVy = 0; dragMode = null; isHold2x = false;
      stageH = reelShell.clientHeight || window.innerHeight;

      const rect = reelShell.getBoundingClientRect();
      if ((e.clientX - rect.left) / rect.width >= 0.72 && activeMediaEl && !activeMediaEl.paused) {
        holdTimer = setTimeout(() => {
          if (ptrDown && !dragMode && activeMediaEl) { isHold2x = true; activeMediaEl.playbackRate = 2; showStatus("2× ▸▸"); }
        }, 260);
      }
    });

    reelShell.addEventListener("pointermove", (e) => {
      if (!ptrDown || isHold2x) return;
      const dx = e.clientX - startX; const dy = e.clientY - startY;
      const now = Date.now(); const dt = Math.max(8, now - lastTime);
      dragVx = 0.65 * ((e.clientX - lastX) / dt) + 0.35 * dragVx;
      dragVy = 0.65 * ((e.clientY - lastY) / dt) + 0.35 * dragVy;
      lastX = e.clientX; lastY = e.clientY; lastTime = now;

      if (dragMode === null) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        clearTimeout(holdTimer);
        if (Math.abs(dx) > Math.abs(dy) * 1.25 && dx > 0) { dragMode = "home"; reelCurrent.style.transition = "none"; }
        else if (Math.abs(dy) >= Math.abs(dx)) {
          if (dy < 0) {
            if (feedIndex < feedVideos.length - 1) { dragMode = "next"; preparePeek("next"); }
            else { dragMode = "bounce-bottom"; reelCurrent.style.transition = "none"; }
          } else {
            if (feedIndex > 0) { dragMode = "prev"; preparePeek("prev"); }
            else { dragMode = "bounce-top"; reelCurrent.style.transition = "none"; }
          }
        }
      }
      if (!dragMode) return;
      if (dragMode === "next") { const y = Math.min(0, dy); reelCurrent.style.transform = `translateY(${y}px)`; reelPeek.style.transform = `translateY(${stageH + CARD_GAP + y}px)`; }
      else if (dragMode === "prev") { const y = Math.max(0, dy); reelCurrent.style.transform = `translateY(${y}px)`; reelPeek.style.transform = `translateY(${-stageH - CARD_GAP + y}px)`; }
      else if (dragMode === "bounce-top") { reelCurrent.style.transform = `translateY(${Math.max(0, dy) * 0.22}px)`; }
      else if (dragMode === "bounce-bottom") { reelCurrent.style.transform = `translateY(${Math.min(0, dy) * 0.22}px)`; }
      else if (dragMode === "home") { reelCurrent.style.transform = `translateX(${Math.max(0, dx)}px)`; }
    });

    function finishFeedPointer(e) {
      if (!ptrDown) return;
      ptrDown = false; clearTimeout(holdTimer);
      if (isHold2x) { isHold2x = false; if (activeMediaEl) activeMediaEl.playbackRate = settings.rate; hideStatus(); return; }

      const dx = e.clientX - startX; const dy = e.clientY - startY;
      const snapMs = 200; const ease = `transform ${snapMs}ms cubic-bezier(0.22, 1, 0.36, 1)`;

      if (!dragMode) {
        if (Date.now() - startTime < 350 && activeMediaEl) {
          if (activeMediaEl.ended) { activeMediaEl.currentTime = 0; activeMediaEl.play(); }
          else if (activeMediaEl.paused) activeMediaEl.play();
          else activeMediaEl.pause();
        }
        return;
      }

      if (dragMode === "home") {
        isTransitioning = true; reelCurrent.style.transition = ease;
        if (dx > 75 || dragVx > 0.4) {
          reelCurrent.style.transform = "translateX(108%)";
          setTimeout(() => { showHomeView(true); cleanupDrag(); isTransitioning = false; }, snapMs);
        } else {
          reelCurrent.style.transform = "translateX(0)";
          setTimeout(() => { cleanupDrag(); isTransitioning = false; }, snapMs);
        }
        return;
      }

      if (dragMode === "bounce-top" || dragMode === "bounce-bottom") {
        isTransitioning = true; reelCurrent.style.transition = ease; reelCurrent.style.transform = "translateY(0)";
        setTimeout(() => { cleanupDrag(); isTransitioning = false; }, snapMs);
        return;
      }

      const mode = dragMode;
      const commitNext = mode === "next" && (-dy > stageH * 0.20 || dragVy < -0.35);
      const commitPrev = mode === "prev" && (dy > stageH * 0.20 || dragVy > 0.35);
      isTransitioning = true; reelCurrent.style.transition = ease; reelPeek.style.transition = ease;

      if (commitNext) {
        stopActiveMedia(); reelCurrent.style.transform = `translateY(${-stageH - CARD_GAP}px)`; reelPeek.style.transform = "translateY(0)";
        setTimeout(() => { loadVideoAt(feedIndex + 1, true); cleanupDrag(); isTransitioning = false; }, snapMs);
      } else if (commitPrev) {
        stopActiveMedia(); reelCurrent.style.transform = `translateY(${stageH + CARD_GAP}px)`; reelPeek.style.transform = "translateY(0)";
        setTimeout(() => { loadVideoAt(feedIndex - 1, true); cleanupDrag(); isTransitioning = false; }, snapMs);
      } else {
        reelCurrent.style.transform = "translateY(0)";
        reelPeek.style.transform = mode === "next" ? `translateY(${stageH + CARD_GAP}px)` : `translateY(${-stageH - CARD_GAP}px)`;
        setTimeout(() => { cleanupDrag(); isTransitioning = false; }, snapMs);
      }
    }

    reelShell.addEventListener("pointerup", finishFeedPointer);
    reelShell.addEventListener("pointercancel", finishFeedPointer);

    let wheelLock = false;
    reelShell.addEventListener("wheel", (e) => {
      if (wheelLock || Math.abs(e.deltaY) < 25) return;
      wheelLock = true; animateReelStep(e.deltaY > 0 ? 1 : -1);
      setTimeout(() => { wheelLock = false; }, 520);
    }, { passive: true });

    // Gestos horizontales en Inicio: ida y vuelta completa (Video -> Sub -> Carpeta -> Raíz y vuelta Raíz -> Carpeta -> Sub -> Video)
    homeView.addEventListener("dragstart", (e) => e.preventDefault());

    function handleHomeSwipeEnd(dx, dy) {
      if (isTransitioning || settingsDrawer.classList.contains("open") || modalBackdrop.classList.contains("open")) return;
      if (Math.abs(dx) <= 50 || Math.abs(dx) <= Math.abs(dy) * 1.35) return;

      if (dx > 0 && currentFolderId) {
        animateFolderChange("back", () => {
          forwardStack.push(currentFolderId);
          const cur = folders.find(f => f.id === currentFolderId);
          currentFolderId = cur ? (cur.parentId || null) : null;
        });
        return;
      }

      if (dx < 0) {
        if (forwardStack.length) {
          const nextId = forwardStack.pop();
          if (folders.some(f => f.id === nextId)) {
            animateFolderChange("forward", () => { currentFolderId = nextId; });
            return;
          }
        }
        if (feedVideos.length) {
          isTransitioning = true;
          homeView.classList.add("slide-out-left");
          setTimeout(() => {
            showFeedView(true);
            homeView.classList.remove("slide-out-left");
            isTransitioning = false;
          }, 170);
        }
      }
    }

    let hTouchX = 0, hTouchY = 0;
    homeView.addEventListener("touchstart", (e) => {
      if (e.changedTouches && e.changedTouches[0]) { hTouchX = e.changedTouches[0].clientX; hTouchY = e.changedTouches[0].clientY; }
    }, { passive: true });
    homeView.addEventListener("touchend", (e) => {
      if (!e.changedTouches || !e.changedTouches[0]) return;
      handleHomeSwipeEnd(e.changedTouches[0].clientX - hTouchX, e.changedTouches[0].clientY - hTouchY);
    }, { passive: true });

    let hMouseDown = false, hMouseX = 0, hMouseY = 0;
    homeView.addEventListener("mousedown", (e) => {
      if (e.button !== 0 || e.target.closest("button, input, label")) return;
      hMouseDown = true; hMouseX = e.clientX; hMouseY = e.clientY;
    });
    window.addEventListener("mouseup", (e) => {
      if (!hMouseDown) return;
      hMouseDown = false;
      if (homeView.classList.contains("view-hidden")) return;
      handleHomeSwipeEnd(e.clientX - hMouseX, e.clientY - hMouseY);
    });

    /* =====================================================================
       8. SCRUBBING, AJUSTES, TECLADO E IMPORTACIÓN
       ===================================================================== */
    function seekFromClientX(clientX) {
      if (!activeMediaEl) return;
      const rect = scrubTrack.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const dur = (activeMediaEl.duration && isFinite(activeMediaEl.duration)) ? activeMediaEl.duration : (activeVideoItem?.duration || 1);
      const targetT = pct * dur;
      scrubFill.style.width = `${pct * 100}%`;
      scrubTooltip.textContent = `${fmt(targetT)} / ${fmt(dur)}`;
      activeMediaEl.currentTime = targetT;
      updateVisuals(targetT);
    }

    scrubZone.addEventListener("pointerdown", (e) => { e.stopPropagation(); isScrubbing = true; scrubZone.classList.add("scrubbing"); scrubZone.setPointerCapture(e.pointerId); seekFromClientX(e.clientX); });
    scrubZone.addEventListener("pointermove", (e) => { if (!isScrubbing) return; e.stopPropagation(); seekFromClientX(e.clientX); });
    function endScrub(e) { if (!isScrubbing) return; e.stopPropagation(); isScrubbing = false; scrubZone.classList.remove("scrubbing"); }
    scrubZone.addEventListener("pointerup", endScrub);
    scrubZone.addEventListener("pointercancel", endScrub);

    const RATES = [1, 1.25, 1.5, 2];
    btnSpeed.addEventListener("click", () => { settings.rate = RATES[(RATES.indexOf(settings.rate) + 1) % RATES.length]; saveSettings(); });

    const drawerBackdrop = document.getElementById("drawerBackdrop");
    const settingsDrawer = document.getElementById("settingsDrawer");
    const openDrawer = () => { drawerBackdrop.classList.add("open"); settingsDrawer.classList.add("open"); };
    const closeDrawer = () => { drawerBackdrop.classList.remove("open"); settingsDrawer.classList.remove("open"); };
    document.getElementById("btnSettings").addEventListener("click", openDrawer);
    openSettingsHome.addEventListener("click", openDrawer);
    document.getElementById("btnCloseSettings").addEventListener("click", closeDrawer);
    drawerBackdrop.addEventListener("click", closeDrawer);

    document.querySelectorAll("[data-set-theme]").forEach(b => b.addEventListener("click", () => { settings.theme = b.dataset.setTheme; saveSettings(); }));
    document.querySelectorAll("[data-set-subs]").forEach(b => b.addEventListener("click", () => { settings.subs = b.dataset.setSubs; saveSettings(); if (activeMediaEl) updateVisuals(activeMediaEl.currentTime); }));
    document.querySelectorAll("[data-set-end]").forEach(b => b.addEventListener("click", () => { settings.onEnd = b.dataset.setEnd; saveSettings(); }));
    document.querySelectorAll("[data-set-rate]").forEach(b => b.addEventListener("click", () => { settings.rate = Number(b.dataset.setRate); saveSettings(); }));
    document.getElementById("setSubDown").addEventListener("click", () => { settings.subSize = Math.max(16, settings.subSize - 2); saveSettings(); });
    document.getElementById("setSubUp").addEventListener("click", () => { settings.subSize = Math.min(34, settings.subSize + 2); saveSettings(); });

    const fileInput = document.getElementById("fileInput");
    fileInput.addEventListener("change", async (e) => {
      const files = [...(e.target.files || [])];
      if (!files.length) return;
      let total = 0;
      for (const f of files) {
        try { total += await importLocalFile(f); }
        catch (err) { showToast(`Error en ${f.name}: ${err.message}`); }
      }
      fileInput.value = "";
      if (total > 0) {
        localItems = await idbGetAll();
        showToast(`Cargados ${total} ${total === 1 ? "video" : "videos"}`);
        renderHome();
      }
    });

    window.addEventListener("keydown", (e) => {
      if (modalBackdrop.classList.contains("open")) {
        if (e.key === "Escape") closeModal();
        return;
      }
      if (feedView.classList.contains("view-hidden")) {
        if (e.key === "ArrowLeft" && currentFolderId) {
          animateFolderChange("back", () => {
            forwardStack.push(currentFolderId);
            const cur = folders.find(f => f.id === currentFolderId);
            currentFolderId = cur ? (cur.parentId || null) : null;
          });
        }
        return;
      }
      if (e.code === "Space" && activeMediaEl) {
        e.preventDefault();
        if (activeMediaEl.paused) activeMediaEl.play(); else activeMediaEl.pause();
      } else if (e.key === "ArrowDown") {
        e.preventDefault(); animateReelStep(1);
      } else if (e.key === "ArrowUp") {
        e.preventDefault(); animateReelStep(-1);
      } else if (e.key === "Escape") {
        if (settingsDrawer.classList.contains("open")) closeDrawer();
        else showHomeView(true);
      }
    });

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    (async () => {
      applySettings();
      ingestCatalogTree();
      try { localItems = await idbGetAll(); } catch {}
      renderHome();
    })();
  </script>
</body>
</html>
